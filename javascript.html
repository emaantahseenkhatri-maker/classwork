<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java and lava are not the same thing</title>
</head>
<body>
    <h1>Java and lava are not the same thing</h1>
    <p>Java is a programming language, while lava is molten rock that erupts from a volcano. They are completely different
        things and should not be confused with each other.</p>
    <script>
        console.log("Java and lava are not the same thing");

        let name = "Emaan";
        let faveColor = "purple";
        let faveFood = "chowmein and lasagna";
        let favesubject = "art";

      console.log(`My name is ${name}, my favorite color is ${faveColor}, my favorite food is ${faveFood}, and my favorite subject is ${favesubject}.`);

       let hobby = {name: "Emaan", faveColor: "purple", faveFood: "chowmein and lasagna", faveSubject: "art"};  
       console.log(`My name is ${hobby.name}, my favorite color is ${hobby.faveColor}, my favorite food is ${hobby.faveFood}, and my favorite subject is ${hobby.faveSubject}.`); 

    </script>
   
</body>
</html>
